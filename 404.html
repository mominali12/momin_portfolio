<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Momin Ali</title>
  <meta name="robots" content="noindex" />

  <!-- FODT -->
  <script>
    (function() {
      var saved = localStorage.getItem('theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
      document.documentElement.classList.add('no-theme-transition');
      window.addEventListener('load', function() {
        requestAnimationFrame(function() {
          document.documentElement.classList.remove('no-theme-transition');
        });
      }, { once: true });
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

  <style>
    /* 404 page layout — full-height centred column */
    .page-404 {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px var(--wrap-px);
      gap: 0;
    }

    .e404-canvas-wrap {
      margin-bottom: 32px;
    }

    #canvas-404 {
      display: block;
      /* size set by JS */
    }

    .e404-code {
      font-family: var(--font-mono);
      font-size: clamp(5rem, 18vw, 9rem);
      font-weight: 500;
      line-height: 1;
      letter-spacing: -0.04em;
      color: var(--accent);
      opacity: 0.18;
      margin: 0;
      /* Robot sits on top of this number via negative margin below */
      position: relative;
      z-index: 0;
    }

    .e404-headline {
      font-size: clamp(1.25rem, 4vw, 1.75rem);
      font-weight: 600;
      color: var(--text-primary);
      margin: 16px 0 12px;
      line-height: 1.25;
      letter-spacing: -0.02em;
    }

    .e404-sub {
      font-size: 1rem;
      color: var(--text-muted);
      max-width: 400px;
      line-height: 1.6;
      margin: 0 0 32px;
    }

    .e404-sub strong {
      color: var(--text-primary);
      font-weight: 500;
    }

    .e404-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* Subtle error path display */
    .e404-path {
      margin-top: 48px;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-muted);
      opacity: 0.6;
    }
  </style>
</head>
<body>

<nav class="nav" id="nav" aria-label="Primary navigation">
  <div class="nav-inner wrap">
    <a href="/" class="brandmark" aria-label="Momin Ali, home">
      <span class="brandmark-initials" aria-hidden="true">MA</span>
      Momin Ali
    </a>
    <div class="nav-right">
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme" title="Toggle theme">
        <svg class="icon-sun" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
          <circle cx="8" cy="8" r="3"/>
          <line x1="8" y1="1" x2="8" y2="2.5"/><line x1="8" y1="13.5" x2="8" y2="15"/>
          <line x1="1" y1="8" x2="2.5" y2="8"/><line x1="13.5" y1="8" x2="15" y2="8"/>
          <line x1="2.93" y1="2.93" x2="3.99" y2="3.99"/><line x1="12.01" y1="12.01" x2="13.07" y2="13.07"/>
          <line x1="13.07" y1="2.93" x2="12.01" y2="3.99"/><line x1="3.99" y1="12.01" x2="2.93" y2="13.07"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
          <path d="M13.5 10A6 6 0 0 1 6 2.5a6 6 0 1 0 7.5 7.5Z"/>
        </svg>
      </button>
    </div>
  </div>
</nav>

<main class="page-404">

  <!-- Robot canvas -->
  <div class="e404-canvas-wrap">
    <canvas id="canvas-404" aria-hidden="true"></canvas>
  </div>

  <!-- Ghost "404" number behind content -->
  <p class="e404-code" aria-hidden="true">404</p>

  <h1 class="e404-headline">This page got lost in the latent space.</h1>

  <p class="e404-sub">
    Even the best models misfire sometimes.<br>
    <strong>The page you're looking for doesn't exist</strong> — but the good stuff is one click away.
  </p>

  <div class="e404-actions">
    <a href="/" class="btn btn-primary">Back to home</a>
    <a href="/#work" class="btn btn-ghost">See the work</a>
  </div>

  <p class="e404-path" id="e404-path"></p>

</main>

<script>
// Show the path that 404'd
(function() {
  var p = window.location.pathname;
  if (p && p !== '/404' && p !== '/404.html') {
    document.getElementById('e404-path').textContent = 'Tried: ' + p;
  }
})();

// Theme toggle (same logic as main site)
(function() {
  var btn = document.getElementById('theme-toggle');
  if (!btn) return;
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem('theme', t);
    btn.setAttribute('aria-label', t === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
  }
  btn.addEventListener('click', function() {
    var current = document.documentElement.getAttribute('data-theme') || 'light';
    applyTheme(current === 'dark' ? 'light' : 'dark');
    document.dispatchEvent(new CustomEvent('themechange'));
  });
})();

// 2D robot — same character as mobile robot in main.js
(function() {
  var canvas = document.getElementById('canvas-404');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  if (!ctx) return;

  var W = 90, H = 116;
  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width  = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.scale(DPR, DPR);

  // roundRect polyfill
  function rr(x, y, w, h, r) {
    var cr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + cr, y);
    ctx.lineTo(x + w - cr, y);
    ctx.arcTo(x + w, y, x + w, y + cr, cr);
    ctx.lineTo(x + w, y + h - cr);
    ctx.arcTo(x + w, y + h, x + w - cr, y + h, cr);
    ctx.lineTo(x + cr, y + h);
    ctx.arcTo(x, y + h, x, y + h - cr, cr);
    ctx.lineTo(x, y + cr);
    ctx.arcTo(x, y, x + cr, y, cr);
    ctx.closePath();
  }

  function getAccent() {
    return getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#2C6EAB';
  }

  var mouseX = W / 2, mouseY = H / 2;
  var headLookX = 0, headLookY = 0;
  var idleT = 0, lastNow = performance.now();
  var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  document.addEventListener('mousemove', function(e) { mouseX = e.clientX; mouseY = e.clientY; }, { passive: true });
  document.addEventListener('touchmove', function(e) {
    if (e.touches.length) { mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY; }
  }, { passive: true });

  function draw(now) {
    requestAnimationFrame(draw);
    var dt = Math.min((now - lastNow) / 1000, 0.05);
    lastNow = now;
    if (!reducedMotion) idleT += dt;

    ctx.clearRect(0, 0, W, H);
    var accent = getAccent();
    var cx = W / 2;

    // Idle bounce
    var bounce = reducedMotion ? 0 : Math.sin(idleT * 1.8) * 1.8;

    // ── BODY ──
    var bodyY = 68 + bounce;
    ctx.fillStyle = '#252836';
    rr(cx - 18, bodyY - 12, 36, 26, 4); ctx.fill();

    // Chest stripe
    ctx.fillStyle = accent;
    rr(cx - 12, bodyY - 6, 24, 6, 2); ctx.fill();

    // Buttons
    ctx.fillStyle = accent;
    ctx.beginPath(); ctx.arc(cx - 5, bodyY + 4, 2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 5, bodyY + 4, 2, 0, Math.PI*2); ctx.fill();

    // Hips
    ctx.fillStyle = '#2e3248';
    rr(cx - 14, bodyY + 14, 28, 7, 3); ctx.fill();

    // Legs
    ctx.fillStyle = '#252836';
    rr(cx - 13, bodyY + 21, 10, 16, 3); ctx.fill();
    rr(cx + 3,  bodyY + 21, 10, 16, 3); ctx.fill();

    // Feet
    ctx.fillStyle = '#3e4460';
    rr(cx - 14, bodyY + 36, 12, 5, 2); ctx.fill();
    rr(cx + 2,  bodyY + 36, 12, 5, 2); ctx.fill();

    // Arms
    ctx.fillStyle = '#252836';
    rr(cx - 25, bodyY - 8, 8, 18, 3); ctx.fill();
    rr(cx + 17, bodyY - 8, 8, 18, 3); ctx.fill();

    // Hands
    ctx.fillStyle = '#3e4460';
    ctx.beginPath(); ctx.arc(cx - 21, bodyY + 12, 5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 21, bodyY + 12, 5, 0, Math.PI*2); ctx.fill();

    // ── HEAD ──
    var headCY = 32 + bounce;
    var rect = canvas.getBoundingClientRect();
    var tx = mouseX - (rect.left + W / 2);
    var ty = mouseY - (rect.top  + headCY);
    var targetLX = Math.max(-6, Math.min(6, tx * 0.04));
    var targetLY = Math.max(-4, Math.min(4, ty * 0.03));
    headLookX += (targetLX - headLookX) * 0.12;
    headLookY += (targetLY - headLookY) * 0.12;
    var hx = cx + (reducedMotion ? 0 : headLookX);
    var hy = headCY + (reducedMotion ? 0 : headLookY);

    // Head body
    ctx.fillStyle = '#252836';
    rr(hx - 21, hy - 18, 42, 32, 6); ctx.fill();

    // Ear nubs
    ctx.fillStyle = '#363c54';
    ctx.fillRect(hx - 24, hy - 9, 4, 15);
    ctx.fillRect(hx + 20, hy - 9, 4, 15);

    // Ear rings
    ctx.strokeStyle = accent;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(hx - 22, hy - 2, 4, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(hx + 22, hy - 2, 4, 0, Math.PI*2); ctx.stroke();

    // Visor frame
    ctx.fillStyle = accent;
    rr(hx - 17, hy - 11, 34, 18, 3); ctx.fill();

    // Visor screen
    ctx.fillStyle = '#060a12';
    rr(hx - 14, hy - 8, 28, 13, 2); ctx.fill();

    // Eyes
    var glowA = reducedMotion ? 0.9 : 0.65 + 0.35 * Math.sin(idleT * 2.2);
    ctx.fillStyle = 'rgba(220,240,255,' + glowA + ')';
    ctx.beginPath(); ctx.arc(hx - 6, hy - 1, 3.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(hx + 6, hy - 1, 3.5, 0, Math.PI*2); ctx.fill();

    // Pupils
    ctx.fillStyle = accent;
    ctx.globalAlpha = glowA;
    ctx.beginPath(); ctx.arc(hx - 6, hy - 1, 2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(hx + 6, hy - 1, 2, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;

    // Cheeks
    ctx.fillStyle = 'rgba(238,112,112,0.38)';
    ctx.beginPath(); ctx.arc(hx - 14, hy + 5, 3.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(hx + 14, hy + 5, 3.5, 0, Math.PI*2); ctx.fill();

    // Smile
    ctx.strokeStyle = 'rgba(200,232,255,0.8)';
    ctx.lineWidth = 1.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(hx, hy + 6, 5, 0.2, Math.PI - 0.2);
    ctx.stroke();

    // ── ANTENNA ──
    var antSway = reducedMotion ? 0 : Math.sin(idleT * 1.8 + 0.5) * 3;
    ctx.strokeStyle = '#4a5060';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(hx + 3, hy - 18);
    ctx.lineTo(hx + 3 + antSway, hy - 28);
    ctx.stroke();

    ctx.fillStyle = accent;
    ctx.globalAlpha = glowA;
    ctx.beginPath(); ctx.arc(hx + 3 + antSway, hy - 30, 3.5, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;

    // ── QUESTION MARK THOUGHT BUBBLE ──
    // Small bubble above robot head — robot is confused about the 404
    var bx = hx + 28, by = hy - 28;
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--surface').trim() || '#fff';
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--border-strong').trim() || '#ccc';
    ctx.lineWidth = 1.2;
    // Bubble
    ctx.beginPath(); ctx.arc(bx, by, 13, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();
    // Small connector dots
    ctx.fillStyle = ctx.strokeStyle;
    ctx.beginPath(); ctx.arc(bx - 8, by + 12, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(bx - 13, by + 18, 2, 0, Math.PI*2); ctx.fill();
    // Question mark
    ctx.fillStyle = accent;
    ctx.font = 'bold 14px ' + (getComputedStyle(document.documentElement).getPropertyValue('--font-mono').trim() || 'monospace');
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('?', bx, by + 1);
  }

  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
