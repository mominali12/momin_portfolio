<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Momin Ali — ML Engineer</title>

  <!--
    PRIMARY redirect: vercel.json handles this at the CDN edge using
    x-vercel-ip-country header (DE/AT/CH → /de/, everything else → /en/).
    No client-side JS needed for geo-detection.

    This inline script is a FALLBACK only — it fires when:
      (a) running locally / on a non-Vercel host, or
      (b) the user has previously saved a manual language preference.
    Manual preference (localStorage 'lang') always wins over geo.
  -->
  <script>
    (function() {
      var saved = localStorage.getItem('lang');
      if (saved === 'de') { window.location.replace('/de/'); return; }
      if (saved === 'en') { window.location.replace('/en/'); return; }
      // No saved preference — fall through to /en/ as default.
      // On Vercel this line is never reached (vercel.json redirects first).
      // On localhost this provides a sensible default.
      window.location.replace('/en/');
    })();
  </script>

  <!-- SEO: canonical and alternates -->
  <link rel="canonical" href="https://momin-ali.dev/en/" />
  <link rel="alternate" hreflang="en" href="https://momin-ali.dev/en/" />
  <link rel="alternate" hreflang="de" href="https://momin-ali.dev/de/" />
  <link rel="alternate" hreflang="x-default" href="https://momin-ali.dev/en/" />
</head>
<body>
  <!-- No-JS fallback -->
  <p>
    <a href="/en/">Continue in English</a>
    &nbsp;/&nbsp;
    <a href="/de/">Auf Deutsch fortfahren</a>
  </p>
</body>
</html>
